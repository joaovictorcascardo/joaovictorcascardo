<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-label="Monitor de preços">
  <style>
    .repo { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #3fb950; }
    .title { font: 700 22px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .desc { font: 400 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9198a1; }
    .chip { font: 500 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
  </style>
  <rect x="0.5" y="0.5" width="599" height="209" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="28" y="38" class="repo">price-monitor-api</text>
  <text x="28" y="68" class="title">Monitor de preços</text>
  <text x="28" y="98" class="desc">Faz scraping do preço de produtos online, confere de novo a cada 4</text><text x="28" y="120" class="desc">horas e avisa por e-mail quando o preço cai.</text>
  <rect x="28" y="160" width="77" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="66.5" y="177.5" text-anchor="middle" class="chip">Node.js</text><rect x="113" y="160" width="100" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="163.0" y="177.5" text-anchor="middle" class="chip">TypeScript</text><rect x="221" y="160" width="100" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="271.0" y="177.5" text-anchor="middle" class="chip">PostgreSQL</text><rect x="329" y="160" width="100" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="379.0" y="177.5" text-anchor="middle" class="chip">Playwright</text>
</svg>
